name: CI & Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies (CMake)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - name: Install Python dependencies & Security tools
      run: |
        python -m pip install --upgrade pip
        pip install pytest bandit pip-audit mypy ruff liboqs-python

    - name: Run Vulnerability Audit (pip-audit)
      run: pip-audit

    - name: Run Static Security Analysis (Bandit)
      run: bandit -r . -ll

    - name: Run Type Checking (mypy)
      run: mypy . || true

    - name: Run Tests with pytest
      run: python -m pytest